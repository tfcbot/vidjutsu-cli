name: Sync CLI with API Changes

on:
  repository_dispatch:
    types: [api-updated]

jobs:
  update-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - uses: anthropics/claude-code-action@v1
        with:
          model: claude-sonnet-4-6
          prompt: |
            The VidJutsu API repo was just updated. Commit: ${{ github.event.client_payload.sha }}
            Commit message: ${{ github.event.client_payload.message }}

            Your job:
            1. Fetch the canonical public contract:
               curl -sL https://raw.githubusercontent.com/tfcbot/vidjutsu-openapi/main/openapi/spec.json -o spec/openapi.json
            2. Compare the OpenAPI operations against the registered CLI commands in src/index.ts and src/commands/
            3. Check if there are new endpoints the CLI doesn't support yet, or if any existing endpoints changed
            4. If changes are needed:
               - Update or create CLI commands to match the API
               - Follow the current patterns in src/commands/generated/watch.ts and src/commands/clone.ts
               - Use the client from src/client.ts
            5. Run bun run check after any change
            6. If no CLI changes are needed (e.g., the API change was backend-only), say so and exit

            Do NOT change the release workflow, install script, or package.json version.
            Only modify spec/openapi.json plus the source and focused tests required by the API change.
          allowed_tools: "Read,Write,Edit,Bash,Glob,Grep"
          direct_prompt: true
          create_pr: true
          pr_title: "sync: Update CLI for API changes (${{ github.event.client_payload.sha }})"
          pr_body: |
            Automated sync from API repo.

            Trigger commit: tfcbot/vidjutsu@${{ github.event.client_payload.sha }}
            Message: ${{ github.event.client_payload.message }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
